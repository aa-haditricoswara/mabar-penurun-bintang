<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Running Text - Mabar Penurun Bintang</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: "Segoe UI", Arial, sans-serif;
}

.stage {
  position: absolute;
  left: 50%;
  bottom: 8%;
  width: min(94vw, 1120px);
  transform: translateX(-50%);
  pointer-events: none;
}

.banner {
  --panel: linear-gradient(105deg, #10151d 0%, #202936 58%, #111820 100%);
  --accent: #ffcf55;
  --accent2: #ffd15c;
  --shine: rgba(255,215,100,.55);

  position: relative;
  display: flex;
  align-items: center;
  min-height: 50px;
  color: #fff;
  background: var(--panel);
  border: 1px solid rgba(255,255,255,.22);
  border-radius: 9px;
  overflow: hidden;
  box-shadow: 0 12px 35px rgba(0,0,0,.38);
  animation: colorCycle 12s infinite;
}

/* RUNNING TEXT */

.follow-bar {
  position: relative;
  display: flex;
  align-items: center;
  width: 100%;
  overflow: hidden;
  background: rgba(0,0,0,.22);
  padding: 10px 14px;
}

.marquee-window {
  width: 100%;
  overflow: hidden;
  white-space: nowrap;
}

.marquee-track {
  display: inline-flex;
  width: max-content;
  align-items: center;
  animation: marquee 15s linear infinite;
}

.marquee-text {
  padding-right: 65px;
  color: #fff;
  font-size: 14px;
  font-weight: 900;
  letter-spacing: .16em;
  text-shadow: 0 1px 4px #000;
}

.marquee-text span {
  color: var(--accent2);
}

/* =================================
    SAPUAN CAHAYA LEMBUT BERLAPIS
    ================================= */

.light-sweep {
  position: absolute;
  top: -80%;
  bottom: -80%;
  left: -45%;
  width: 27%;
  height: 260%;
  z-index: 5;
  pointer-events: none;
  background:
    linear-gradient(
      90deg,
      transparent 0%,
      rgba(255,255,255,.015) 12%,
      rgba(255,255,255,.08) 28%,
      rgba(255,255,255,.24) 43%,
      rgba(255,255,255,.48) 50%,
      rgba(255,255,255,.24) 57%,
      rgba(255,255,255,.08) 72%,
      rgba(255,255,255,.015) 88%,
      transparent 100%
    );
  filter: blur(13px);
  opacity: 0;
  transform: translateX(-180%) skewX(-18deg);
  mix-blend-mode: screen;
  animation: softSweep 6.4s linear infinite;
}

.light-sweep.two {
  width: 23%;
  filter: blur(17px);
  animation-delay: -1.6s;
}

.light-sweep.three {
  width: 30%;
  filter: blur(20px);
  animation-delay: -3.2s;
}

.light-sweep.four {
  width: 20%;
  filter: blur(14px);
  animation-delay: -4.8s;
}

@keyframes softSweep {
  0% {
    transform: translateX(-180%) skewX(-18deg);
    opacity: 0;
  }
  8% {
    opacity: .48;
  }
  45% {
    opacity: .62;
  }
  88% {
    opacity: .42;
  }
  100% {
    transform: translateX(650%) skewX(-18deg);
    opacity: 0;
  }
}

/* GLOW LEMBUT */

.light-glow {
  position: absolute;
  top: -100%;
  bottom: -100%;
  left: -45%;
  width: 42%;
  z-index: 4;
  pointer-events: none;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.025),
    var(--shine),
    rgba(255,255,255,.12),
    transparent
  );
  filter: blur(24px);
  opacity: 0;
  transform: translateX(-180%) skewX(-18deg);
  mix-blend-mode: screen;
  animation: glowSweep 8s linear infinite;
}

.light-glow.two {
  animation-delay: -4s;
  width: 35%;
  filter: blur(28px);
}

@keyframes glowSweep {
  0% {
    transform: translateX(-180%) skewX(-18deg);
    opacity: 0;
  }
  12% {
    opacity: .45;
  }
  85% {
    opacity: .4;
  }
  100% {
    transform: translateX(500%) skewX(-18deg);
    opacity: 0;
  }
}

/* SIKLUS WARNA */

@keyframes colorCycle {
  0%, 24.99% {
    --panel: linear-gradient(105deg,#10151d 0%,#202936 58%,#111820 100%);
    --accent: #ffcf55;
    --accent2: #ffd15c;
    --shine: rgba(255,215,100,.55);
  }
  25%, 49.99% {
    --panel: linear-gradient(105deg,#09182d 0%,#183b65 58%,#0b1b30 100%);
    --accent: #7bd5ff;
    --accent2: #9bdfff;
    --shine: rgba(80,180,255,.65);
  }
  50%, 74.99% {
    --panel: linear-gradient(105deg,#080808 0%,#292216 38%,#806020 72%,#090909 100%);
    --accent: #f5d98a;
    --accent2: #ffdf91;
    --shine: rgba(255,211,112,.75);
  }
  75%, 99.99% {
    --panel: linear-gradient(105deg,#071d1b 0%,#124b46 48%,#092824 100%);
    --accent: #8affdf;
    --accent2: #aaffeb;
    --shine: rgba(75,255,220,.75);
  }
}

@keyframes marquee {
  0% {
    transform: translateX(0);
  }
  100% {
    transform: translateX(-50%);
  }
}
</style>
</head>

<body>

<div class="stage">

  <section class="banner">

    <!-- SAPUAN CAHAYA -->
    <div class="light-glow"></div>
    <div class="light-glow two"></div>

    <div class="light-sweep one"></div>
    <div class="light-sweep two"></div>
    <div class="light-sweep three"></div>
    <div class="light-sweep four"></div>

    <!-- RUNNING TEXT -->
    <div class="follow-bar">
      <div class="marquee-window">
        <div class="marquee-track">
          <div class="marquee-text">
            MABAR <span>PENURUN BINTANG</span> • MABAR <span>PENURUN BINTANG</span> • MABAR <span>PENURUN BINTANG</span> • MABAR <span>PENURUN BINTANG</span> •
          </div>
          <div class="marquee-text">
            MABAR <span>PENURUN BINTANG</span> • MABAR <span>PENURUN BINTANG</span> • MABAR <span>PENURUN BINTANG</span> • MABAR <span>PENURUN BINTANG</span> •
          </div>
        </div>
      </div>
    </div>

  </section>

</div>

</body>
</html>
